name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run tests
        run: |
          ./mill -i echoctl.test

      - name: Build native image
        run: |
          ./mill -i echoctl.nativeImage

      - name: Native smoke test
        run: |
          ./out/echoctl/nativeImage/dest/echoctl --help
